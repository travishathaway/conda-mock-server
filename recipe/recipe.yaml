schema_version: 1

context:
  name: conda-mock-server
  version: 0.1.0
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../

build:
  number: 0
  noarch: python
  script: build.sh
  python:
    entry_points:
      - cms = conda_mock_server.cli:main

requirements:
  host:
    - python >=${{ python_min }}
    - hatchling >=1.27.0
    - pip
    - click
    - flask
    - py-rattler
    - conda-index
  run:
    - python >=${{ python_min }}
    - click
    - flask
    - py-rattler
    - conda-index

tests:
  - python:
      pip_check: true
  - requirements:
      run:
        - python >=${{ python_min }}
    script:
      - cms --help

about:
  summary: HTTP server that serves a mock conda channel for testing
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/travishathaway/conda-mock-server

extra:
  recipe-maintainers:
    - travishathaway

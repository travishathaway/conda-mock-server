[project]
name = "conda-mock-server"
version = "0.1.0"
description = "conda channel mock server"
requires-python = ">=3.10"
dependencies = ["click", "flask", "py-rattler", "conda-index"]

[project.scripts]
cms = "conda_mock_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conda_mock_server"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64", "linux-aarch64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.11"
click = "*"
flask = "*"
py-rattler = "*"
conda-index = "*"

[tool.pixi.pypi-dependencies]
conda-mock-server = { path = ".", editable = true }
